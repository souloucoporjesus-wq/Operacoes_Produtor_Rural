<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Análise do Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --fundo: #f4f6f2;
    --superficie: #ffffff;
    --suave: #eef1ea;
    --tinta: #171d18;
    --tinta-2: #55605a;
    --tinta-3: #7a857f;
    --linha: #dde3dc;
    --destaque: #1f6b3a;
    --destaque-suave: #e2efe5;
    --critico: #d03b3b;
    --critico-suave: #fbe9e9;
    --serio: #ec835a;
    --serio-suave: #fdeee7;
    --alerta: #fab219;
    --alerta-suave: #fff5dc;
    --bom: #0ca30c;
    --bom-suave: #e3f5e3;
    --info: #6b7a8f;
    --info-suave: #edf0f4;
    --area-consultoria: #2a78d6;
    --area-projetos: #eb6834;
    --area-cs: #1baf7a;
    --barra: #2a78d6;
    --sombra: 0 1px 2px rgba(23, 29, 24, 0.06);
    --fonte: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fundo: #121513; --superficie: #1a1f1b; --suave: #232925;
      --tinta: #edf1ec; --tinta-2: #a9b3ac; --tinta-3: #87918a; --linha: #2c332e;
      --destaque: #62c184; --destaque-suave: #1e3527;
      --critico-suave: #3a2020; --serio-suave: #3a2a22; --alerta-suave: #3a321c;
      --bom-suave: #1d331d; --info: #9aa8bb; --info-suave: #252b33;
      --area-consultoria: #3987e5; --area-projetos: #d95926; --area-cs: #199e70; --barra: #3987e5;
      --sombra: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fundo: #121513; --superficie: #1a1f1b; --suave: #232925;
    --tinta: #edf1ec; --tinta-2: #a9b3ac; --tinta-3: #87918a; --linha: #2c332e;
    --destaque: #62c184; --destaque-suave: #1e3527;
    --critico-suave: #3a2020; --serio-suave: #3a2a22; --alerta-suave: #3a321c;
    --bom-suave: #1d331d; --info: #9aa8bb; --info-suave: #252b33;
    --area-consultoria: #3987e5; --area-projetos: #d95926; --area-cs: #199e70; --barra: #3987e5;
    --sombra: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fundo); color: var(--tinta); font-family: var(--fonte);
    font-size: 14.5px; line-height: 1.5; padding: 0 16px 96px;
  }
  a { color: var(--destaque); }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 22px; font-weight: 600; text-wrap: balance; }
  h2 { font-size: 17px; font-weight: 600; text-wrap: balance; }
  h3 { font-size: 14.5px; font-weight: 600; }
  ul { margin: 0; padding: 0; list-style: none; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
  .rotulo { font-size: 11.5px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--tinta-3); }
  .mudo { color: var(--tinta-2); }
  .fraco { color: var(--tinta-3); }
  .num { font-variant-numeric: tabular-nums; }

  .pagina { max-width: 1180px; margin: 0 auto; }

  /* Cabeçalho */
  header.topo { padding: 22px 0 14px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
  .topo .sub { margin-top: 4px; color: var(--tinta-2); font-size: 13.5px; }
  .topo .acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .botao {
    border: 1px solid var(--linha); background: var(--superficie); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; line-height: 1.3;
  }
  .botao:hover { border-color: var(--tinta-3); }
  .botao.primario { background: var(--destaque); border-color: var(--destaque); color: #fff; }
  :root[data-theme="dark"] .botao.primario { color: #0f1a12; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .botao.primario { color: #0f1a12; } }
  select.botao { padding-right: 8px; }

  /* Navegação */
  nav.abas {
    position: sticky; top: 0; z-index: 5; background: var(--fundo);
    display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; border-bottom: 1px solid var(--linha);
    scrollbar-width: thin;
  }
  @media (min-width: 900px) { nav.abas { flex-wrap: wrap; overflow-x: visible; } }
  .aba {
    flex: none; border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    color: var(--tinta-2); font-size: 13.5px; font-weight: 500; display: flex; gap: 6px; align-items: center;
  }
  .aba:hover { background: var(--suave); color: var(--tinta); }
  .aba[aria-selected="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra); border: 1px solid var(--linha); }
  .aba .cont { font-size: 11.5px; background: var(--suave); border-radius: 99px; padding: 0 7px; color: var(--tinta-2); }
  .aba .cont.quente { background: var(--critico); color: #fff; }

  main { padding-top: 18px; }
  section.painel { display: none; }
  section.painel.ativo { display: block; }
  .titulo-secao { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .titulo-secao p { color: var(--tinta-2); font-size: 13.5px; max-width: 70ch; }
  .bloco + .bloco { margin-top: 26px; }
  .abertura + .bloco { margin-top: 12px; }

  /* Cartões */
  .cartao {
    background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--sombra);
  }
  .grade { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  @media (max-width: 420px) { .g2, .g3 { grid-template-columns: 1fr; } }
  .lista > * + * { margin-top: 10px; }

  /* Termômetro e resumo */
  .abertura { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 820px) { .abertura { grid-template-columns: 1fr; } }
  .termometro { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 99px; }
  .termometro::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .t-tenso { background: var(--critico-suave); color: var(--critico); }
  .t-atencao { background: var(--alerta-suave); color: #9a6a00; }
  .t-estavel { background: var(--bom-suave); color: var(--bom); }
  :root[data-theme="dark"] .t-atencao { color: var(--alerta); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-atencao { color: var(--alerta); } }
  .resumo li { padding-left: 16px; position: relative; }
  .resumo li + li { margin-top: 8px; }
  .resumo li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 2px; background: var(--destaque); }
  .resumo li:first-child { font-weight: 500; }

  .foco { counter-reset: foco; }
  .foco .cartao { position: relative; padding-left: 52px; }
  .foco .cartao::before {
    counter-increment: foco; content: counter(foco); position: absolute; left: 16px; top: 14px;
    width: 26px; height: 26px; border-radius: 8px; background: var(--destaque-suave); color: var(--destaque);
    display: grid; place-items: center; font-weight: 600; font-size: 13px;
  }
  .foco .acao { margin-top: 8px; font-size: 13.5px; }
  .foco .acao b { font-weight: 600; }

  /* Números */
  .numeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .numero { background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; }
  .numero:hover { border-color: var(--tinta-3); }
  .numero .valor { font-size: 26px; font-weight: 600; line-height: 1.1; margin-top: 4px; }
  .numero .valor.critico { color: var(--critico); }

  /* Selos */
  .selos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .selo { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--suave); color: var(--tinta-2); white-space: nowrap; }
  .selo.critica, .selo.alerta { background: var(--critico-suave); color: var(--critico); }
  .selo.alta, .selo.serio { background: var(--serio-suave); color: #b4512a; }
  .selo.media, .selo.atencao { background: var(--alerta-suave); color: #8a5f00; }
  .selo.baixa, .selo.info { background: var(--info-suave); color: var(--info); }
  .selo.positivo, .selo.resolvida { background: var(--bom-suave); color: var(--bom); }
  .selo.chefe { background: var(--tinta); color: var(--superficie); }
  .selo.parada, .selo.atrasada { background: var(--critico-suave); color: var(--critico); }
  .selo.semregistro { background: var(--alerta-suave); color: #8a5f00; }
  :root[data-theme="dark"] .selo.alta, :root[data-theme="dark"] .selo.serio { color: var(--serio); }
  :root[data-theme="dark"] .selo.media, :root[data-theme="dark"] .selo.atencao, :root[data-theme="dark"] .selo.semregistro { color: var(--alerta); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .selo.alta, :root:not([data-theme="light"]) .selo.serio { color: var(--serio); }
    :root:not([data-theme="light"]) .selo.media, :root:not([data-theme="light"]) .selo.atencao, :root:not([data-theme="light"]) .selo.semregistro { color: var(--alerta); }
  }
  .confianca { font-size: 11px; color: var(--tinta-3); border: 1px solid var(--linha); border-radius: 4px; padding: 0 5px; white-space: nowrap; }

  /* Itens (pendências, destravar etc.) */
  .item { border-left: 4px solid var(--linha); }
  .item.p-critica, .item.g-alerta { border-left-color: var(--critico); }
  .item.p-alta { border-left-color: var(--serio); }
  .item.p-media, .item.g-atencao { border-left-color: var(--alerta); }
  .item.p-baixa, .item.g-info { border-left-color: var(--info); }
  .item.g-positivo { border-left-color: var(--bom); }
  .item .cabeca { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .item h3 { margin-bottom: 6px; }
  .item .detalhe { margin-top: 6px; }
  .item .meta { margin-top: 8px; font-size: 13px; color: var(--tinta-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .item.feito { opacity: 0.55; }
  .item.feito h3 { text-decoration: line-through; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--tinta-2); font-size: 13px; }
  summary:hover { color: var(--tinta); }
  blockquote {
    margin: 8px 0 0; padding: 8px 12px; background: var(--suave); border-radius: 8px;
    font-size: 13.5px; color: var(--tinta); white-space: pre-wrap;
  }
  .marcar { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--tinta-2); cursor: pointer; white-space: nowrap; }
  .marcar input { width: 16px; height: 16px; accent-color: var(--destaque); }

  .campo { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 12px; margin-top: 8px; font-size: 13.5px; }
  .campo dt { color: var(--tinta-3); }
  .campo dd { margin: 0; }
  @media (max-width: 520px) { .campo { grid-template-columns: 1fr; } .campo dd { margin-bottom: 6px; } }

  /* Rascunho de mensagem */
  .rascunho { margin-top: 10px; background: var(--destaque-suave); border-radius: 10px; padding: 10px 12px; }
  .rascunho .texto { white-space: pre-wrap; font-size: 13.5px; margin-top: 4px; }
  .rascunho .barra-r { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  /* Filtros */
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .chip { border: 1px solid var(--linha); background: var(--superficie); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--tinta); color: var(--superficie); border-color: var(--tinta); }
  .busca { border: 1px solid var(--linha); background: var(--superficie); border-radius: 8px; padding: 6px 10px; min-width: 200px; flex: 1 1 200px; max-width: 320px; }
  .vazio { padding: 22px; text-align: center; color: var(--tinta-3); border: 1px dashed var(--linha); border-radius: 12px; }

  /* Time */
  .area-titulo { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .area-titulo .marca { width: 12px; height: 12px; border-radius: 3px; }
  .pessoa .nome { display: flex; align-items: center; gap: 8px; }
  .pessoa .bolinha { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* Entrelinhas */
  .citacao { font-size: 15px; line-height: 1.5; padding: 10px 14px; border-left: 3px solid var(--tinta-3); background: var(--suave); border-radius: 0 8px 8px 0; margin-top: 8px; }
  .leituras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 640px) { .leituras { grid-template-columns: 1fr; } }
  .leitura { border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
  .leitura.ruim { background: var(--critico-suave); }
  .leitura.boa { background: var(--bom-suave); }
  .leitura .rotulo { margin-bottom: 2px; }
  .como-agir { margin-top: 10px; font-size: 13.5px; }

  /* Antes e depois */
  .antes-depois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 640px) { .antes-depois { grid-template-columns: 1fr; } }
  .antes-depois > div { border-radius: 8px; padding: 8px 12px; font-size: 13.5px; white-space: pre-wrap; }
  .antes-depois .antes { background: var(--critico-suave); }
  .antes-depois .depois { background: var(--bom-suave); }

  /* Barras de volume */
  .barras { display: grid; gap: 6px; }
  .barra-linha { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; border-radius: 6px; }
  .barra-linha:hover { background: var(--suave); }
  .barra-linha .nome-b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2); }
  .barra-trilho { height: 10px; position: relative; }
  .barra-trilho span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--barra); border-radius: 0 4px 4px 0; min-width: 3px; }
  .barra-linha .v { text-align: right; color: var(--tinta-2); }
  .dica-flutuante {
    position: fixed; pointer-events: none; z-index: 20; background: var(--tinta); color: var(--superficie);
    font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 280px; display: none;
  }

  /* Dicas */
  .dica .pratica { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--destaque-suave); font-size: 13.5px; }
  .dica .ligada { margin-top: 8px; font-size: 12.5px; color: var(--tinta-3); }

  table.hist { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.hist th, table.hist td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linha); }
  table.hist th { color: var(--tinta-3); font-weight: 500; font-size: 12px; }
  table.hist td.num, table.hist th.num { text-align: right; }

  footer.rodape { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--linha); font-size: 12.5px; color: var(--tinta-3); }

  .aviso-copia {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--tinta); color: var(--superficie); padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .aviso-copia.on { opacity: 1; }

  @media (forced-colors: active) {
    .barra-trilho span { background: CanvasText; }
    .selo { border: 1px solid CanvasText; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="pagina">
  <header class="topo">
    <div>
      <div class="rotulo">Análise do Teams · confidencial</div>
      <h1 id="titulo">Análise do Teams</h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="acoes">
      <select class="botao" id="historico-sel" aria-label="Abrir outra análise"></select>
      <button class="botao" id="tema" type="button" aria-label="Alternar tema claro e escuro">Tema</button>
    </div>
  </header>

  <nav class="abas" id="abas" role="tablist" aria-label="Seções"></nav>

  <main id="conteudo"></main>

  <footer class="rodape" id="rodape"></footer>
</div>
<div class="dica-flutuante" id="dica-flutuante" role="tooltip"></div>
<div class="aviso-copia" id="aviso-copia" role="status" aria-live="polite"></div>

<script id="dados" type="application/json">/*__DADOS__*/null</script>
<script id="historico" type="application/json">/*__HISTORICO__*/[]</script>
<script>
(function () {
  "use strict";
  var BASE = "/*__BASE__*/";
  var D = JSON.parse(document.getElementById("dados").textContent || "null");
  var H = JSON.parse(document.getElementById("historico").textContent || "[]");
  if (!D) { document.getElementById("conteudo").innerHTML = '<p class="vazio">Sem dados.</p>'; return; }

  // ---------- utilidades ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function guardar(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {} }
  function ler(chave, padrao) {
    try { var v = localStorage.getItem(chave); return v == null ? padrao : JSON.parse(v); } catch (e) { return padrao; }
  }
  function chaveDe(t) { return "teams-feito:" + String(t || "").toLowerCase().replace(/[^a-z0-9à-ú]+/gi, "-").slice(0, 80); }
  var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  function dataLonga(iso) {
    var p = String(iso).split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return DIAS[d.getDay()] + ", " + (+p[2]) + " de " + MESES[+p[1] - 1] + " de " + p[0];
  }
  function dataCurta(iso) { if (!iso) return ""; var p = String(iso).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : iso; }
  function diasEntre(a, b) {
    if (!a || !b) return null;
    var pa = a.split("-"), pb = b.split("-");
    var da = new Date(+pa[0], +pa[1] - 1, +pa[2]), db = new Date(+pb[0], +pb[1] - 1, +pb[2]);
    return Math.round((db - da) / 86400000);
  }
  function idade(desde) {
    var n = diasEntre(desde, D.data); if (n == null) return "";
    if (n <= 0) return "hoje"; if (n === 1) return "há 1 dia"; return "há " + n + " dias";
  }
  var CONF = { certo: "Certo", provavel: "Provável", suposicao: "Suposição" };
  function conf(c) { return c ? '<span class="confianca" title="Confiança da leitura">' + esc(CONF[c] || c) + "</span>" : ""; }
  var PRIOR = { critica: "Crítica", alta: "Alta", media: "Média", baixa: "Baixa" };
  var STATUS = { nova: "Nova", aberta: "Aberta", atrasada: "Atrasada", parada: "Parada", resolvida: "Resolvida" };
  var TIPO = { voce_deve: "Você deve", time_deve: "Time deve", outra_area_deve: "Outra área deve" };
  var GRAV = { alerta: "Alerta", atencao: "Atenção", info: "Informação", positivo: "Positivo" };
  var AREA = { consultoria: "Consultoria", projetos: "Projetos", cs: "Sucesso do cliente", outro: "Outros" };
  var ORDEM_P = { critica: 0, alta: 1, media: 2, baixa: 3 };
  var ORDEM_G = { alerta: 0, atencao: 1, info: 2, positivo: 3 };

  function avisar(msg) {

    }
    if (arr(e.melhorar).length) {
      s += '<div class="bloco"><div class="titulo-secao"><h2>O que melhorar na escrita</h2></div><div class="lista">' + arr(e.melhorar).map(function (m) {
        return '<article class="cartao item p-media"><h3>' + esc(m.padrao) + "</h3>" +
          (m.impacto ? '<p class="detalhe mudo">' + esc(m.impacto) + "</p>" : "") +
          ((m.antes || m.depois) ? '<div class="antes-depois"><div class="antes"><div class="rotulo">Como saiu</div>' + esc(m.antes) + '</div><div class="depois"><div class="rotulo">Como podia sair</div>' + esc(m.depois) + "</div></div>" : "") +
          evid(m.evidencia) + "</article>";
      }).join("") + "</div></div>";
    }
    s += '<div class="bloco"><div class="titulo-secao"><h2>Como você decide</h2><p>' + esc(d.resumo || "") + "</p></div>";
    s += arr(d.padroes).length ? '<div class="grade g2">' + arr(d.padroes).map(function (p) {
      return '<article class="cartao"><div class="cabeca"><h3>' + esc(p.padrao) + "</h3>" + conf(p.confianca) + "</div>" +
        '<dl class="campo">' + (p.efeito ? "<dt>Efeito</dt><dd>" + esc(p.efeito) + "</dd>" : "") + (p.sugestao ? "<dt>Sugestão</dt><dd>" + esc(p.sugestao) + "</dd>" : "") + "</dl>" + evid(p.evidencia) + "</article>";
    }).join("") + "</div>" : '<p class="vazio">Sem observações de decisão nesta janela.</p>';
    s += "</div>";
    if (arr(D.aprendizados).length) {
      s += '<div class="bloco"><div class="titulo-secao"><h2>O que aprendi (pra você confirmar)</h2><p>Só entra na memória do sistema quando você confirmar, pelo /atualizar.</p></div><div class="lista">' +
        arr(D.aprendizados).map(function (a) {
          return '<article class="cartao"><div class="cabeca"><div><span class="selo">' + esc(a.sobre) + '</span><p style="margin-top:6px">' + esc(a.texto) + "</p></div>" + conf(a.confianca) + "</div>" + evid(a.evidencia) + "</article>";
        }).join("") + "</div></div>";
    }
    return s;
  })();

  // Dicas e cuidados
  function cartaoCuidado(c) {
    var g = { alta: "alerta", media: "atencao", baixa: "info" }[c.gravidade] || "info";
    return '<article class="cartao item g-' + g + '"><div class="cabeca"><h3>' + esc(c.titulo) + '</h3><span class="selo ' + g + '">' + esc({ alta: "Alto", media: "Médio", baixa: "Baixo" }[c.gravidade] || c.gravidade) + "</span></div>" +
      '<p class="detalhe">' + esc(c.detalhe) + "</p>" + evid(c.evidencia) + "</article>";
  }
  html.dicas = (function () {
    var s = '<div class="titulo-secao"><h2>Dicas de liderança</h2><p>Cada dica sai de um fato desta janela, com uma prática pra hoje.</p></div>';
    s += arr(D.dicas).length ? '<div class="grade g2">' + arr(D.dicas).map(function (d) {
      var k = "teams-pratica:" + D.data + ":" + chaveDe(d.titulo);
      return '<article class="cartao dica"><h3>' + esc(d.titulo) + '</h3><p class="detalhe">' + esc(d.texto) + "</p>" +
        (d.pratica ? '<div class="pratica"><label class="marcar" style="color:inherit;white-space:normal;align-items:flex-start"><input type="checkbox" data-pratica="' + esc(k) + '"' + (ler(k, false) ? " checked" : "") + "> <span><b>Pratique hoje:</b> " + esc(d.pratica) + "</span></label></div>" : "") +
        (d.ligada_a ? '<p class="ligada">Ligada a: ' + esc(d.ligada_a) + "</p>" : "") + "</article>";
    }).join("") + "</div>" : '<p class="vazio">Sem dicas nesta janela.</p>';
    var c = arr(D.cuidados).slice().sort(function (a, b) { return ({ alta: 0, media: 1, baixa: 2 }[a.gravidade] || 3) - ({ alta: 0, media: 1, baixa: 2 }[b.gravidade] || 3); });
    s += '<div class="bloco"><div class="titulo-secao"><h2>Cuidados</h2><p>O que pode virar problema pra você.</p></div>';
    s += c.length ? '<div class="grade g2">' + c.map(cartaoCuidado).join("") + "</div>" : '<p class="vazio">Nenhum cuidado especial.</p>';
    return s + "</div>";
  })();

  // Mensagens prontas
  html.mensagens = (function () {
    var l = arr(D.mensagens);
    var s = '<div class="titulo-secao"><h2>Mensagens prontas</h2><p>Rascunhos pra copiar, ajustar e mandar. Nada é enviado sozinho.</p></div>';
    if (!l.length) return s + '<p class="vazio">Sem mensagens sugeridas.</p>';
    return s + '<div class="grade g2">' + l.map(function (m) {
      return '<article class="cartao"><div class="rotulo">Para ' + esc(m.para) + "</div><h3 style=\"margin-top:2px\">" + esc(m.assunto) + "</h3>" +
        (m.por_que ? '<p class="detalhe mudo" style="font-size:13.5px">' + esc(m.por_que) + "</p>" : "") + rascunho(m.texto, "Texto") + "</article>";
    }).join("") + "</div>";
  })();

  // Histórico
  html.historico = (function () {
    var s = '<div class="titulo-secao"><h2>Histórico</h2><p>Todas as análises guardadas. Clique pra abrir.</p></div>';
    if (!H.length) return s + '<p class="vazio">Esta é a primeira análise.</p>';
    return s + '<div class="cartao" style="overflow-x:auto"><table class="hist"><thead><tr><th>Data</th><th>Termômetro</th><th class="num">Críticas</th><th class="num">Em aberto</th><th class="num">Alertas no time</th><th class="num">Mensagens</th></tr></thead><tbody>' +
      H.slice().reverse().map(function (h) {
        var atual = h.data === D.data;
        return "<tr><td>" + (atual ? "<b>" + esc(dataCurta(h.data)) + "/" + esc(String(h.data).slice(0, 4)) + "</b> (esta)" : '<a href="' + esc(BASE + h.data) + '.html">' + esc(dataCurta(h.data)) + "/" + esc(String(h.data).slice(0, 4)) + "</a>") +
          "</td><td>" + esc({ tenso: "Tenso", atencao: "Atenção", estavel: "Estável" }[h.nivel] || h.nivel || "") + '</td><td class="num">' + esc(h.criticas) +
          '</td><td class="num">' + esc(h.abertas) + '</td><td class="num">' + esc(h.alertas) + '</td><td class="num">' + esc(h.mensagens != null ? Number(h.mensagens).toLocaleString("pt-BR") : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  })();

  // ---------- montar ----------
  var nav = document.getElementById("abas"), main = document.getElementById("conteudo");
  nav.innerHTML = SECOES.map(function (s) {
    return '<button class="aba" type="button" role="tab" id="aba-' + s.id + '" aria-controls="sec-' + s.id + '" aria-selected="false" data-aba="' + s.id + '">' + esc(s.nome) +
      (s.cont ? '<span class="cont' + (s.quente ? " quente" : "") + '">' + s.cont + "</span>" : "") + "</button>";
  }).join("");
  main.innerHTML = SECOES.map(function (s) {
    return '<section class="painel" role="tabpanel" id="sec-' + s.id + '" aria-labelledby="aba-' + s.id + '">' + (html[s.id] || "") + "</section>";
  }).join("");
  document.getElementById("rodape").innerHTML = "Confidencial: fala de pessoas do time. Não encaminhar, não publicar. " +
    "Gerado em " + esc(String(D.gerado_em || "").replace("T", " ").slice(0, 16)) + " a partir do Teams (só leitura).";

  function abrir(id, rolar) {
    if (!document.getElementById("sec-" + id)) id = "hoje";
    SECOES.forEach(function (s) {
      document.getElementById("sec-" + s.id).classList.toggle("ativo", s.id === id);
      document.getElementById("aba-" + s.id).setAttribute("aria-selected", s.id === id ? "true" : "false");
    });
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    var aba = document.getElementById("aba-" + id); if (aba && aba.scrollIntoView) aba.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (rolar) window.scrollTo({ top: 0 });
  }
  nav.addEventListener("click", function (ev) { var b = ev.target.closest("[data-aba]"); if (b) abrir(b.getAttribute("data-aba"), true); });
  nav.addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var ids = SECOES.map(function (s) { return s.id; });
    var atual = ids.indexOf((location.hash || "#hoje").slice(1));
    var prox = ids[(atual + (ev.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    abrir(prox, false); document.getElementById("aba-" + prox).focus();
  });
  abrir((location.hash || "#hoje").slice(1), false);

  // cliques gerais
  document.addEventListener("click", function (ev) {
    var c = ev.target.closest("[data-copiar]"); if (c) { copiar(c.getAttribute("data-copiar")); return; }
    var ir = ev.target.closest("[data-ir]"); if (ir) { abrir(ir.getAttribute("data-ir"), true); return; }
  });
  document.addEventListener("change", function (ev) {
    var f = ev.target.getAttribute && ev.target.getAttribute("data-feito");
    if (f) { guardar(f, ev.target.checked); ev.target.closest(".item").classList.toggle("feito", ev.target.checked); filtrarPend(); return; }
    var p = ev.target.getAttribute && ev.target.getAttribute("data-pratica");
    if (p) guardar(p, ev.target.checked);
  });

  // filtros de pendências
  var fTipo = "";
  function filtrarPend() {
    var lista = document.getElementById("lista-pend"); if (!lista) return;
    var prior = (document.getElementById("f-prior") || {}).value || "";
    var busca = ((document.getElementById("f-busca") || {}).value || "").toLowerCase().trim();
    var esconder = (document.getElementById("f-esconder") || {}).checked;
    var vis = 0;
    lista.querySelectorAll("[data-item=pend]").forEach(function (el) {
      var ok = (!fTipo || el.getAttribute("data-tipo") === fTipo) && (!prior || el.getAttribute("data-prior") === prior) &&
        (!busca || el.getAttribute("data-texto").indexOf(busca) >= 0) && !(esconder && el.classList.contains("feito"));
      el.hidden = !ok; if (ok) vis++;
    });
    document.getElementById("pend-vazio").hidden = vis > 0;
  }
  var fp = document.getElementById("filtros-pend");
  if (fp) {
    fp.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-f-tipo]"); if (!b) return;
      fTipo = b.getAttribute("data-f-tipo");
      fp.querySelectorAll("[data-f-tipo]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      filtrarPend();
    });
    document.getElementById("f-prior").addEventListener("change", filtrarPend);
    document.getElementById("f-busca").addEventListener("input", filtrarPend);
    document.getElementById("f-esconder").addEventListener("change", filtrarPend);
    document.getElementById("copiar-feitos").addEventListener("click", function () {
      var feitos = [].slice.call(document.querySelectorAll("[data-feito]:checked")).map(function (i) { return "- " + i.getAttribute("data-titulo"); });
      if (!feitos.length) { avisar("Nenhuma marcada como resolvida"); return; }
      copiar("Resolvi (análise do Teams de " + dataCurta(D.data) + "):\n" + feitos.join("\n"));
    });
  }
  var ft = document.getElementById("filtros-time");
  if (ft) {
    ft.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-f-grav]"); if (!b) return;
      var g = b.getAttribute("data-f-grav");
      ft.querySelectorAll("[data-f-grav]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      document.querySelectorAll("#sec-time .pessoa").forEach(function (el) { el.hidden = !!g && el.getAttribute("data-grav") !== g; });
      document.querySelectorAll("#sec-time .grupo-time").forEach(function (gr) { gr.hidden = !gr.querySelector(".pessoa:not([hidden])"); });
    });
  }

  // dica flutuante das barras
  var dica = document.getElementById("dica-flutuante");
  document.addEventListener("mousemove", function (ev) {
    var b = ev.target.closest && ev.target.closest("[data-dica]");
    if (!b) { dica.style.display = "none"; return; }
    dica.textContent = b.getAttribute("data-dica"); dica.style.display = "block";
    var x = Math.min(ev.clientX + 14, window.innerWidth - dica.offsetWidth - 8);
    dica.style.left = x + "px"; dica.style.top = (ev.clientY + 16) + "px";
  });
})();
</script>
</body>
</html>
